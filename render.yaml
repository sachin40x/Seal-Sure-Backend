services:
  - type: web
    name: sealsure-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URL
        fromDatabase:
          name: sealsure-db
          property: connectionString
      - key: JWT_SECRET
        value: "your-super-secret-jwt-key-change-this-in-production-sealsure-2024"
      - key: PYTHON_SERVICE_URL
        value: https://seal-sure-api-1.onrender.com

databases:
  - name: sealsure-db
    plan: free
    databaseName: sealsure
